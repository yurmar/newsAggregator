[program:news-aggregator-worker]
command=/usr/bin/php /var/www/news-aggregator/bin/console messenger:consume async --time-limit=3600 -vv
directory=/var/www/news-aggregator
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=0
startretries=10

process_name=%(program_name)s_%(process_num)02d

redirect_stderr=true
stdout_logfile=/var/www/news-aggregator/var/log/messenger-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

stopwaitsecs=60
killasgroup=true
stopasgroup=true
